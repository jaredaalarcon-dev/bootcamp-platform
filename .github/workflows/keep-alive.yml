# Keep-alive: visita el backend cada 10 minutos para que Render (plan gratis)
# no lo apague por inactividad. También mantiene activa la base de datos de Supabase.
# Configuración: GitHub → Settings → Secrets and variables → Actions → Variables
#   → New repository variable → Nombre: BACKEND_URL  Valor: https://tu-api.onrender.com
name: Keep-alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Visitar /health del backend
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}
        run: |
          if [ -z "$BACKEND_URL" ]; then
            echo "Falta la variable BACKEND_URL (ver comentario al inicio de este archivo)."
            exit 0
          fi
          curl -fsS --max-time 90 --retry 2 --retry-delay 10 "$BACKEND_URL/health" && echo " ✔ backend activo"
